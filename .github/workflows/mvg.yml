name: Homeboard MVG-Abfahrten aktualisieren
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
concurrency:
  group: homeboard-mvg
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: MVG-Abfahrten abrufen
        run: python scripts/update_mvg.py
      - name: MVG-Datei veröffentlichen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mvg.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Homeboard MVG departures'
            git pull --rebase origin main
            git push
          fi
